global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'airflow-cluster'
    environment: 'sandbox'

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  - '/etc/prometheus/alerts.yml'

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Loki for logging metrics
  - job_name: 'loki'
    static_configs:
      - targets: ['localhost:3100']

  # Node Exporter (Docker host)
  - job_name: 'node_exporter'
    static_configs:
      - targets: ['host.docker.internal:9100', 'airflow-web-1:9100']

  # Airflow scheduler metrics
  - job_name: 'airflow_scheduler'
    static_configs:
      - targets: ['airflow-web-1:8790']

  # DAG Processor Manager for custom pipeline metrics
  - job_name: 'dag_processor_manager'
    static_configs:
      - targets: ['airflow-web-1:8888']

  # Spark master (metrics endpoint)
  - job_name: 'spark_master'
    static_configs:
      - targets: ['airflow-web-1:8080']

  # Feature Engineering Service
  - job_name: 'feature_engineering'
    static_configs:
      - targets: ['feature-engineering-service:8000']

  # ML Training Service (GPU metrics)
  - job_name: 'ml_training'
    static_configs:
      - targets: ['ml-training-service:9090']

  # Orchestration Manager (Airflow custom metrics)
  - job_name: 'orchestration'
    static_configs:
      - targets: ['airflow-web-1:8999']
