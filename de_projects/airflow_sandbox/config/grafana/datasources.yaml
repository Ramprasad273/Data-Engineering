apiVersion: 1

datasources:
  # Prometheus for metrics
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    version: 1
    uid: prometheus-ds

  # Loki for logs
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: true
    version: 1
    uid: loki-ds

  # Grafana Cloud (if using managed service)
  - name: Grafana Cloud
    type: grafanacloud
    access: proxy
    orgId: 1
    url: https://api.grafana.net
    password: ''
    user: ''
    database: prometheus_cloudwatch_logs
    basicAuth: false
    basicAuthUser: ''
    secureJsonData:
      cloud:
        region: global
