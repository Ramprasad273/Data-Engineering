# Grafana Dashboards Provisioning Configuration
# =============================================

apiVersion: 1

providers:
  
  # ==================== DEFAULT AIRFLOW DASHBOARD ====================
  
  - name: 'default'
    orgId: 1
    folder: ''
    type: file
    disableOptions:
      edit: false
      delete: false
    options:
      path: /var/lib/grafana/dashboards/default
      foldersFromFilesStructure: true
  
  # ==================== PIPELINE-SPECIFIC DASHBOARDS ====================
  
  - name: 'pipelines'
    orgId: 1
    folder: 'Pipelines'
    type: file
    disableOptions:
      edit: false
      delete: false
    options:
      path: /var/lib/grafana/dashboards/pipelines
  
  # ==================== SPARK CLUSTER DASHBOARDS ====================
  
  - name: 'spark-cluster'
    orgId: 1
    folder: 'Spark Cluster'
    type: file
    disableOptions:
      edit: false
      delete: false
    options:
      path: /var/lib/grafana/dashboards/spark-cluster
  
  # ==================== MONITORING STACK DASHBOARDS ====================
  
  - name: 'monitoring'
    orgId: 1
    folder: 'Monitoring Stack'
    type: file
    disableOptions:
      edit: false
      delete: false
    options:
      path: /var/lib/grafana/dashboards/monitoring
