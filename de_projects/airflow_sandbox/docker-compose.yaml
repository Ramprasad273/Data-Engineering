version: '3.8'

# x-airflow-common block - Common configuration for Airflow services
x-airflow-common: &x-airflow-common
  image: ${AIRFLOW_IMAGE:-apache/airflow:2.9.3}
  environment:
    PATH: /home/airflow/.local/bin:/usr/local/bin:/usr/bin:/bin
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-airflow}@airflow-db/${POSTGRES_DB:-airflow}
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    _PIP_ADDITIONAL_REQUIREMENTS: "dbt-postgres psycopg2-binary"
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    - ./config:/opt/airflow/config
    - ./dbt_project:/opt/airflow/dbt_project
    - ./scripts:/opt/airflow/scripts

services:
  # ==================== METRICS & LOGGING STACK ====================

  prometheus:
    container_name: metrics_prometheus
    image: prom/prometheus:v2.50.1
    restart: unless-stopped
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    networks:
      - airflow_network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  promtail:
    container_name: metrics_promtail
    image: grafana/promtail:2.9.4
    restart: unless-stopped
    volumes:
      - ./config/promtail/config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command: "-config.file=/etc/promtail/config.yml"
    networks:
      - airflow_network

  loki:
    container_name: metrics_loki
    image: grafana/loki:2.9.4
    restart: unless-stopped
    volumes:
      - ./config/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    command: "-config.file=/etc/loki/loki-config.yml"
    ports:
      - "3100:3100"
    networks:
      - airflow_network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3100/-/ready"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ==================== AIRFLOW SERVICES ====================

  airflow-db:
    image: postgres:15-alpine
    container_name: metrics_airflow_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-airflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airflow}
      POSTGRES_DB: ${POSTGRES_DB:-airflow}
    volumes:
      - airflow_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER:-airflow} -d $${POSTGRES_DB:-airflow}']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - airflow_network

  airflow-init:
    <<: *x-airflow-common
    container_name: metrics_airflow_init
    depends_on:
      airflow-db:
        condition: service_healthy
    entrypoint: /bin/bash
    command: >
      -c "mkdir -p /opt/airflow/dags /opt/airflow/logs /opt/airflow/plugins &&
          airflow db migrate &&
          airflow users create --username ${_AIRFLOW_WWW_USER_USERNAME:-admin} --password ${_AIRFLOW_WWW_USER_PASSWORD:-admin} --firstname ${_AIRFLOW_WWW_USER_FIRSTNAME:-Admin} --lastname ${_AIRFLOW_WWW_USER_LASTNAME:-User} --role Admin --email ${_AIRFLOW_WWW_USER_EMAIL:-admin@example.com} || true"
    networks:
      - airflow_network

  statsd-exporter:
    image: prom/statsd-exporter:v0.26.1
    container_name: metrics_statsd_exporter
    ports:
      - "9102:9102"
    networks:
      - airflow_network
    volumes:
      - ./config/statsd-exporter/custom-metrics.yml:/etc/statsd-exporter/custom-metrics.yml:ro

  airflow-webserver:
    <<: *x-airflow-common
    container_name: metrics_airflow_webserver
    command: webserver
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-airflow}@airflow-db/${POSTGRES_DB:-airflow}
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__WEBSERVER__EXPOSE_UI: "true"
      _PIP_ADDITIONAL_REQUIREMENTS: "dbt-postgres psycopg2-binary"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-db:
        condition: service_healthy
      statsd-exporter:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    ports:
      - "8080:8080"
    networks:
      - airflow_network

  airflow-scheduler:
    <<: *x-airflow-common
    container_name: metrics_airflow_scheduler
    command: scheduler
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-airflow}@airflow-db/${POSTGRES_DB:-airflow}
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__KERBEROS__ENABLED: "false"
      _PIP_ADDITIONAL_REQUIREMENTS: "dbt-postgres psycopg2-binary"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-db:
        condition: service_healthy
      statsd-exporter:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - airflow_network

  # ==================== SPARK SERVICES ====================

  spark-master:
    image: apache/spark:3.5.0
    container_name: metrics_spark_master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    volumes:
      - ./spark/jobs:/opt/spark/workdir/jobs
    environment:
      SPARK_CONF: |
        spark.executor.cores=2
        spark.executor.memory=1g
        spark.driver.memory=1g
        spark.sql.shuffle.partitions=8
        spark.yarn.enabled=false
        spark.history.server.enabled=false
        spark.ui.proxyUser.enabled=true
    ports:
      - "7077:7077"
      - "4040:4040"
      - "${SPARK_WEBUI_PORT:-8081}:8080"
    networks:
      - airflow_network

  spark-worker-1:
    image: apache/spark:3.5.0
    container_name: metrics_spark_worker_1
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    volumes:
      - ./spark/jobs:/opt/spark/workdir/jobs
    environment:
      SPARK_CONF: |
        spark.executor.cores=2
        spark.executor.memory=1g
    depends_on:
      - spark-master
    networks:
      - airflow_network

  # ==================== MONITORING SERVICES ====================

  node-exporter:
    container_name: metrics_node_exporter
    image: prom/node-exporter:v1.8.0
    command: ["--web.listen-address=:9100"]
    ports:
      - "9100:9100"
    networks:
      - airflow_network

  grafana-server:
    container_name: metrics_grafana_server
    image: grafana/grafana:10.4.2
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    networks:
      - airflow_network

  # ==================== CLINICAL E2E WAREHOUSE & AUTOMATED INIT ====================

  clinical-postgres:
    image: postgres:16-alpine
    container_name: clinical_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${CLINICAL_DB_NAME:-healthcare_dwh}
      POSTGRES_USER: ${CLINICAL_DB_USER:-clinical_admin}
      POSTGRES_PASSWORD: ${CLINICAL_DB_PASSWORD:-clinical_secure_password}
    ports:
      - "${CLINICAL_DB_PORT:-5433}:5432"
    volumes:
      - clinical_pgdata:/var/lib/postgresql/data
    networks:
      - airflow_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-clinical_admin} -d $${POSTGRES_DB:-healthcare_dwh}"]
      interval: 5s
      timeout: 5s
      retries: 5

  clinical-init:
    image: ${AIRFLOW_IMAGE:-apache/airflow:2.9.3}
    container_name: clinical_init_setup
    depends_on:
      clinical-postgres:
        condition: service_healthy
    environment:
      DB_HOST: clinical-postgres
      DB_PORT: "5432"
      DB_NAME: ${CLINICAL_DB_NAME:-healthcare_dwh}
      DB_USER: ${CLINICAL_DB_USER:-clinical_admin}
      DB_PASSWORD: ${CLINICAL_DB_PASSWORD:-clinical_secure_password}
    volumes:
      - ./scripts:/opt/airflow/scripts
      - ./dbt_project:/opt/airflow/dbt_project
    networks:
      - airflow_network
    entrypoint: /bin/bash
    command: >
      -c "pip install --no-cache-dir dbt-postgres psycopg2-binary &&
          echo '=== [1/3] Waiting for Clinical PostgreSQL ===' &&
          python -c 'import psycopg2, os; psycopg2.connect(host=os.environ[\"DB_HOST\"], port=int(os.environ[\"DB_PORT\"]), dbname=os.environ[\"DB_NAME\"], user=os.environ[\"DB_USER\"], password=os.environ[\"DB_PASSWORD\"])' &&
          echo '=== [2/3] Generating and Seeding Synthetic Clinical EHR Data ===' &&
          python /opt/airflow/scripts/generate_synthetic_data.py &&
          echo '=== [3/3] Running Initial dbt Transformation & Materialization ===' &&
          cd /opt/airflow/dbt_project &&
          dbt run --profiles-dir . &&
          dbt test --profiles-dir . &&
          echo '=== Setup Complete: Clinical Data Loaded and Transformed into DB ==='"

networks:
  airflow_network:
    driver: bridge

volumes:
  airflow_db_data:
  loki_data:
  prometheus_data:
  grafana_data:
  clinical_pgdata:
