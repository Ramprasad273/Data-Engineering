version: 2

models:
  - name: dim_patients
    description: "Core patient dimension defining demographics and cohort classifications."
    columns:
      - name: patient_id
        tests:
          - unique
          - not_null

  - name: dim_departments
    description: "Hospital department dimension with acute care facilities."
    columns:
      - name: department_id
        tests:
          - unique
          - not_null

  - name: fct_icu_hourly_patient_vitals
    description: "Core fact table joining hourly vital sign aggregates with active ICU stay timeline."
    columns:
      - name: patient_id
        tests:
          - not_null
      - name: telemetry_hour
        tests:
          - not_null

  - name: fct_clinical_encounters
    description: "Core fact table capturing inpatient clinical admission records."
    columns:
      - name: encounter_id
        tests:
          - unique
          - not_null
