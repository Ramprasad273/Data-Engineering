clinical_postgres:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('DB_HOST', 'localhost') }}"
      user: "{{ env_var('DB_USER', 'clinical_admin') }}"
      password: "{{ env_var('DB_PASSWORD', 'clinical_secure_password') }}"
      port: "{{ env_var('DB_PORT', '5432') | int }}"
      dbname: "{{ env_var('DB_NAME', 'healthcare_dwh') }}"
      schema: public
      threads: 4
